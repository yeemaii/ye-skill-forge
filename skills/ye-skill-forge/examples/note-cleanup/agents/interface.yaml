interface:
  display_name: "会议纪要整理"
  short_description: "将粗略会议记录整理为结构化、可核查的纪要"
  default_prompt: "使用 $note-cleanup 整理会议记录，并保留决定和行动项的来源依据。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "environment"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "中立源格式；运行时效果需独立验证"
