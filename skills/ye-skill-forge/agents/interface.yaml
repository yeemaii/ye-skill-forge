interface:
  display_name: "Ye Skill Forge"
  short_description: "按需引导创建、审查和改进 Skill，支持可选先例研究与效果验证"
  default_prompt: "使用 $ye-skill-forge 帮我创建或改进 Skill；目标不清时引导我选择方向，明确时直接完成并验证。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "codex"
    - "claude-code"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "environment"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "完整 Skill 目录和可选 openai.yaml；安装与行为需客户端复测"
    claude-code: "完整 Skill 目录；由宿主 Agent 使用资源，原生调用需复测"
    generic: "中立源格式；按实际文件和脚本能力降级，不依赖子 Agent"
