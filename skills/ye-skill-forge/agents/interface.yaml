interface:
  display_name: "Ye Skill Forge"
  short_description: "从根问题到单 Skill 或多 Skill 包的设计、验证和进化"
  default_prompt: "使用 $ye-skill-forge 先澄清根问题，再创建、审查、组合、改进或交付可复用 Skill，并保留可核查证据。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "codex"
    - "claude-code"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "environment"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    codex: "完整 Skill 目录和可选 openai.yaml；安装与行为需客户端复测"
    claude-code: "完整 Skill 目录；由宿主 Agent 使用资源，原生调用需复测"
    generic: "中立源格式；按实际文件和脚本能力降级，不依赖子 Agent"
