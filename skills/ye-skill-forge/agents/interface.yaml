interface:
  display_name: "Ye Skill Forge"
  short_description: "从根问题到单 Skill 或多 Skill 包的设计、验证和进化"
  default_prompt: "使用 $ye-skill-forge 先澄清根问题，再创建、审查、组合、改进或交付可复用 Skill，并保留可核查证据。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "源格式加适配元数据；目标客户端行为需复测"
    claude: "源格式加适配元数据；目标客户端行为需复测"
    generic: "中立源格式"
    agent-skills-compatible: "中立源格式；运行时效果需独立验证"
    vscode: "源格式加 VS Code 说明；目标客户端行为需复测"
